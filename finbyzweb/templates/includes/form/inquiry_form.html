<section id="inquiry-form-section" class="mt-100 bg-layer inquiry-form-section">
	<div class="container">
		<div class="row p-5">
			<div class="col-md-6 bg-white br-left inquiry-form-image d-flex align-items-center justify-content-center">
				<div class="mt-4 mb-4">
					<div class="text-center">
						<h2 class="t-blue">
							Request for FREE Demo
						</h2>
					</div>
					<img src="/files/envelope-icon.svg" alt="Request for FREE Demo" title="Request for FREE Demo"
						class="finbyz-zoomin pt-4">
				</div>
			</div>
			<div class="col-md-6 mtn-1 mln-2 bg-white br-right inquiry-form-fields">
				<div id="inquiry-form">
					<form id="inquiry" name="contact" class="inquiry-main bg-white ml-auto mt-4 mb-4"
						accept-charset="utf-8">
						<h3 class="t-blue d-none">
							Request for FREE Demo
						</h3>
						<label class="d-block">
							<input class="form-control inquiry-input" name="lead_name" type="text" id="lead_name"
								placeholder="Name">
							<label class="inquiry-label"><span>Name</span>
							</label>
						</label>
						<label class="d-block">
							<input class="form-control inquiry-input" name="company_name" type="text" id="company_name"
								placeholder="Organization Name">
							<label class="inquiry-label"><span>Organization Name</span>
							</label>
						</label>
						<label class="d-block">
							<input class="form-control inquiry-input" name="email" type="email" id="email"
								placeholder="Email">
							<label class="inquiry-label"><span>Email</span>
							</label>
						</label>
						<label class="d-block">
							<div class="d-flex">
								<select class="form-control inquiry-input country-code-select" id="country_code"
									name="country_code" style="width: 100px; margin-right: 5px;">
									<option value="+91">🇮🇳 +91</option>
									<option value="+1">🇺🇸 +1</option>
									<option value="+44">🇬🇧 +44</option>
									<option value="+971">🇦🇪 +971</option>
									<option value="+966">🇸🇦 +966</option>
									<option value="+65">🇸🇬 +65</option>
									<option value="+61">🇦🇺 +61</option>
									<option value="+49">🇩🇪 +49</option>
									<option value="+33">🇫🇷 +33</option>
									<option value="+81">🇯🇵 +81</option>
									<option value="+86">🇨🇳 +86</option>
									<option value="+27">🇿🇦 +27</option>
									<option value="+234">🇳🇬 +234</option>
									<option value="+254">🇰🇪 +254</option>
									<option value="+60">🇲🇾 +60</option>
									<option value="+63">🇵🇭 +63</option>
									<option value="+92">🇵🇰 +92</option>
									<option value="+880">🇧🇩 +880</option>
									<option value="+94">🇱🇰 +94</option>
									<option value="+977">🇳🇵 +977</option>
								</select>
								<input class="form-control inquiry-input" data-bind="value:mobile_no" id="mobile_no"
									name="mobile_no" min="0" required="" placeholder="Mobile No" type="text"
									oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
									maxlength="15">
							</div>
							<!-- <input class="form-control inquiry-input" data-bind="value:mobile_no" id="mobile_no" name="mobile_no" min="0"
							required="" placeholder="Mobile No" type="number"
							oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
							maxlength="15"> -->
							<label class="inquiry-label"><span>Mobile No</span>
							</label>
						</label>

						<!-- <input name="submit" type="submit" value="Send"/> -->
						<div class="text-center mt-4">
							<button class="btn finbyz-button" name="submit" type="submit" value="Send">Submit</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

</section>
